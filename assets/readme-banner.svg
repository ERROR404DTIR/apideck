<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">APIDeck</title><desc id="d">An API request editor and response inspector in a dark workspace.</desc><defs><linearGradient id="bg"><stop stop-color="#19273e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="85" y="75" width="1030" height="175" rx="13" fill="#0b1728" stroke="#405873" stroke-width="2"/><rect x="110" y="100" width="180" height="42" rx="7" fill="#153a38" stroke="#62e3c1"/><text x="145" y="128" fill="#62e3c1" font-family="monospace" font-size="17">GET</text><rect x="310" y="100" width="740" height="42" rx="7" fill="#142238"/><text x="335" y="128" fill="#edf3ff" font-family="monospace" font-size="15">https://api.example.dev/v1/items</text><path d="M110 170H1050" stroke="#2d4159" stroke-width="2"/><g fill="#91a0ba" font-family="monospace" font-size="14"><text x="130" y="205">STATUS: 200</text><text x="390" y="205">LATENCY: —</text><text x="650" y="205">RESPONSE: JSON</text></g><path d="M110 225H390" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 280;280 0" dur="3s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">APIDECK</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">REQUEST / RESPONSE / COLLECTIONS</text></svg>